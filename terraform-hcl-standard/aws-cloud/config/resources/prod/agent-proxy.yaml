global:
  region: nrt
  aws_region: ap-northeast-1
  # US Spot edge: Oregon is preferred for Asia-facing traffic. Keep this
  # configurable so capacity policy can move without changing node identity.
  aws_us_region: us-west-2
  # Keep the logical HK entry/domain stable while its ephemeral runtime uses
  # Singapore. UAT proved the full SSH/bootstrap/service/observability path on
  # port 22 there, while ap-east-1 accepted TCP without returning an SSH banner.
  aws_hk_region: ap-southeast-1
  name_prefix: agent-proxy-prod
  user_data_file: cloud-init.yaml

ssh_keys:
  - name: ai-workspace-admin
    # Derived by the deployment workflow from the Vault-managed private key.
    # This keeps the EC2 key pair and the Ansible key on the same rotation.
    public: "{{ env['SSH_PUBLIC_DEPLOY_KEY'] }}"

hosts:
  - name: agent-proxy-node-prod
    # Stable short identity for CMDB, dashboards, and operator-facing lists.
    # Keep the Terraform resource name above unchanged so state addresses do
    # not move just because the display identity is improved.
    node_id: ap-prod-tky
    short_hostname: ap-prod-tky
    display_name: "ap-prod-tky (tky-on-demand)"
    cloud_provider: aws
    cloud_region: ap-northeast-1
    location: tky
    node_label: tky-on-demand
    # This is the active Graviton image, not a generic x64 image.  Keep it
    # pinned so a routine application rollout cannot replace the protected
    # production node when AWS publishes a newer AMI.
    os_name: "Debian 12 ARM64 (bookworm, pinned production image)"
    ami_id: "ami-023861868341f6ac7"
    # 2 vCPU / 1 GiB, AWS Graviton (T4g), on-demand and continuously running.
    plan: {{ env.get('AGENT_PROXY_PLAN_API', 't4g.micro') }}
    billing_mode: on_demand
    elastic_ip: true
    # Reserved Instances are an account-level billing discount; when enabled
    # externally, AWS applies it automatically to this matching instance.
    reserved_instance: false
    # Stop is allowed; termination requires an explicit protection override.
    deletion_protection: true
    backups: false
    enable_ipv6: true
    # Debian's official AWS AMI installs the EC2 key for the admin account;
    # privilege escalation is handled by Ansible after the SSH connection.
    ansible_user: admin
    groups: [agent_proxy, debian]
    tags: [debian]
    # Agent Proxy's public transport endpoint. Keep this declaration beside
    # the host so the generated security group and the CMDB stay in sync.
    security_group_ingress:
      - port: 1443
        protocol: tcp
        cidr: 0.0.0.0/0
    host_vars:
      role: primary
      service_domains:
        - agent-proxy-selfhost-prod-jp.{{ env['TARGET_DOMAIN_BASE'] }}

  - name: agent-proxy-node-prod-us
    # Short identity separates the regional Spot node from the Tokyo primary
    # without changing its stable public service domain.
    node_id: ap-prod-us
    short_hostname: ap-prod-us
    display_name: "ap-prod-us (us-spot)"
    cloud_provider: aws
    cloud_region: us-west-2
    location: us
    node_label: us-spot
    # US production edge is intentionally ephemeral: ARM64 T4g Spot, two
    # vCPU/one GiB, and a local one-hour shutdown timer. It does not receive an
    # EIP; its regional hostname is the stable service identity.
    aws_provider: us
    aws_region: us-west-2
    # New regional instances prefer Debian 13 ARM64 and fall back to Debian 12
    # through the generated AMI filter when Debian 13 is unavailable.
    os_name: "Debian 13 ARM64 (preferred; Debian 12 fallback)"
    plan: {{ env.get('AGENT_PROXY_US_PLAN_API', 't4g.micro') }}
    billing_mode: spot
    spot_instance: true
    max_runtime_minutes: 60
    elastic_ip: false
    deletion_protection: false
    backups: false
    enable_ipv6: true
    ansible_user: admin
    groups: [agent_proxy, debian]
    tags: [debian, prod, us, spot]
    security_group_ingress:
      - port: 1443
        protocol: tcp
        cidr: 0.0.0.0/0
    host_vars:
      role: regional
      service_domains:
        - agent-proxy-selfhost-prod-us.{{ env['TARGET_DOMAIN_BASE'] }}

  - name: agent-proxy-node-prod-hk
    node_id: ap-prod-hk
    short_hostname: ap-prod-hk
    display_name: "ap-prod-hk (hk-spot · Singapore fallback)"
    cloud_provider: aws
    cloud_region: ap-southeast-1
    location: hk
    node_label: hk-spot
    aws_provider: hk
    aws_region: ap-southeast-1
    # Resolve the official Debian ARM64 image in the physical runtime region;
    # the logical HK identity and public service domain remain unchanged.
    os_name: "Debian 13 ARM64 (preferred; Debian 12 fallback)"
    plan: {{ env.get('AGENT_PROXY_HK_PLAN_API', 't4g.micro') }}
    billing_mode: spot
    spot_instance: true
    max_runtime_minutes: 60
    elastic_ip: false
    deletion_protection: false
    backups: false
    enable_ipv6: true
    ansible_user: admin
    groups: [agent_proxy, debian]
    tags: [debian, prod, hk, spot]
    security_group_ingress:
      - port: 1443
        protocol: tcp
        cidr: 0.0.0.0/0
    host_vars:
      role: regional
      service_domains:
        - agent-proxy-selfhost-prod-hk.{{ env['TARGET_DOMAIN_BASE'] }}
