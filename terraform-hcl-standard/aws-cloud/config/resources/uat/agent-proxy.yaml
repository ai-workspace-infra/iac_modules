global:
  region: nrt
  aws_region: ap-northeast-1
  aws_us_region: us-west-2
  aws_hk_region: ap-east-1
  name_prefix: agent-proxy-uat
  user_data_file: cloud-init.yaml

ssh_keys:
  # Key pairs are regional AWS resources but this stack has isolated
  # Terraform workspaces per environment. Keep UAT ownership separate from
  # the production key pair so an ephemeral UAT apply never attempts to
  # recreate or take over the production-managed resource.
  - name: ai-workspace-admin-uat
    public: "ssh-rsa  shenlan@shenlandeMacBook-Air-2.local"

hosts:
  - name: agent-proxy-node-uat
    node_id: ap-uat-tky
    short_hostname: ap-uat-tky
    display_name: "JP XConnect · Tokyo Spot"
    cloud_provider: aws
    cloud_region: ap-northeast-1
    location: tky
    node_label: jpn-tky-spot
    os_name: "Debian 12 ARM64 (bookworm)"
    # AWS T4g.micro is 2 vCPU / 1 GiB. UAT is an ephemeral one-hour Spot
    # validation node, never a long-lived Vultr default.
    plan: {{ env.get('AGENT_PROXY_PLAN_API', 't4g.micro') }}
    billing_mode: spot
    spot_instance: true
    max_runtime_minutes: 60
    elastic_ip: false
    deletion_protection: false
    backups: false
    enable_ipv6: true
    # The Debian 12 ARM64 AMI accepts the EC2 deployment key as `admin`.
    # Keep this aligned with the production T4g node so the generated CMDB
    # never makes the deployment runner retry a prohibited root login.
    ansible_user: admin
    groups: [agent_proxy, debian]
    tags: [debian]
    host_vars:
      role: regional
      service_domains:
        - jp-xconnect.{{ env['TARGET_DOMAIN_BASE'] }}

  - name: agent-proxy-node-uat-hk
    node_id: ap-uat-hk
    short_hostname: ap-uat-hk
    display_name: "HK XConnect · Hong Kong Ephemeral"
    cloud_provider: aws
    cloud_region: ap-east-1
    location: hk
    node_label: hk-ephemeral
    aws_provider: hk
    aws_region: ap-east-1
    # Pin the official Debian 12 ARM64 image for ap-east-1. The shared
    # Debian 13/12 most_recent lookup selected an HK image that opened TCP/22
    # but never accepted the injected EC2 key pair, blocking bootstrap.
    # Debian publishes this regional image for SSH user `admin`.
    os_name: "Debian 12 ARM64 (bookworm, pinned for ap-east-1 SSH compatibility)"
    ami_id: "ami-03de17a63e9b79ec4"
    # ap-east-1 one-time Spot instances repeatedly reached running/TCP-ready
    # state without ever serving an SSH banner. Keep HK ephemeral through the
    # one-hour shutdown policy, but use on-demand capacity for reliable boot.
    plan: {{ env.get('AGENT_PROXY_HK_PLAN_API', 't4g.micro') }}
    billing_mode: on_demand
    spot_instance: false
    max_runtime_minutes: 60
    elastic_ip: false
    deletion_protection: false
    backups: false
    enable_ipv6: true
    ansible_user: admin
    groups: [agent_proxy, debian]
    tags: [debian, uat, hk, ephemeral]
    host_vars:
      role: regional
      service_domains:
        - hk-xconnect.{{ env['TARGET_DOMAIN_BASE'] }}

  - name: agent-proxy-node-uat-us
    node_id: ap-uat-us
    short_hostname: ap-uat-us
    display_name: "US XConnect · West Spot"
    cloud_provider: aws
    cloud_region: us-west-2
    location: us
    node_label: us-ca-spot
    aws_provider: us
    aws_region: us-west-2
    os_name: "Debian 13 ARM64 (preferred; Debian 12 fallback)"
    plan: {{ env.get('AGENT_PROXY_US_PLAN_API', 't4g.micro') }}
    billing_mode: spot
    spot_instance: true
    max_runtime_minutes: 60
    elastic_ip: false
    deletion_protection: false
    backups: false
    enable_ipv6: true
    ansible_user: admin
    groups: [agent_proxy, debian]
    tags: [debian, uat, us, spot]
    host_vars:
      role: regional
      service_domains:
        - us-xconnect.{{ env['TARGET_DOMAIN_BASE'] }}
