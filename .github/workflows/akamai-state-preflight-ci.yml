name: Akamai State Preflight Contract
on:
  pull_request:
    paths: [scripts/akamai_state_preflight.py, scripts/tests/test_akamai_state_preflight.py, scripts/pipeline/akamai-preflight-action.py, scripts/pipeline/tests/test_delivery_action_handoff.py, .github/actions/akamai-state-preflight/**, .github/workflows/akamai-state-preflight*.yml, scripts/pipeline/unified/**, terraform-hcl-standard/scripts/iac_identity.py, scripts/pipeline/tests/test_iac_target_catalog.py, terraform-hcl-standard/akamai-cloud/scripts/**, terraform-hcl-standard/akamai-cloud/tests/**]
  push:
    branches: [main, feature/akamai-data-preflight]
    paths: [scripts/akamai_state_preflight.py, scripts/tests/test_akamai_state_preflight.py, scripts/pipeline/akamai-preflight-action.py, scripts/pipeline/tests/test_delivery_action_handoff.py, .github/actions/akamai-state-preflight/**, .github/workflows/akamai-state-preflight*.yml, scripts/pipeline/unified/**, terraform-hcl-standard/scripts/iac_identity.py, scripts/pipeline/tests/test_iac_target_catalog.py, terraform-hcl-standard/akamai-cloud/scripts/**, terraform-hcl-standard/akamai-cloud/tests/**]
permissions:
  contents: read
jobs:
  read-only-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: python3 -m pip install PyYAML==6.0.2 Jinja2==3.1.6
      - run: python3 scripts/tests/test_akamai_state_preflight.py
      - run: python3 scripts/pipeline/tests/test_iac_target_catalog.py
      - run: python3 terraform-hcl-standard/akamai-cloud/tests/test_state_contract.py
      - run: python3 terraform-hcl-standard/akamai-cloud/tests/test_generate.py
