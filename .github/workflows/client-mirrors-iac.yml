name: Client Dual-Mirror IaC

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform-hcl-standard/client-mirrors/**"
      - ".github/workflows/client-mirrors-iac.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode (plan, apply, or verify-only)
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - verify
      gitops_ref:
        description: GitOps ref containing resources/svc.plus/prod/client-mirrors/mirrors.yaml
        required: true
        type: string
        default: main
      run_cdn_verify_txt:
        description: Ensure Cloudflare verification.<zone> TXT matches Aliyun CDN before plan/apply
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: client-mirrors-iac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-validate:
    name: Offline HCL, render & schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r terraform-hcl-standard/client-mirrors/requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Run unit tests and HCL policy check
        run: |
          python -m unittest discover -s terraform-hcl-standard/client-mirrors/tests -v
          python3 terraform-hcl-standard/client-mirrors/scripts/generate.py check-hcl --root terraform-hcl-standard/client-mirrors
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform-hcl-standard/client-mirrors
      - name: Render fixture and validate Terraform schemas
        run: |
          python3 terraform-hcl-standard/client-mirrors/scripts/generate.py render \
            --resources terraform-hcl-standard/client-mirrors/tests/fixtures/mirrors.yaml \
            --workdir terraform-hcl-standard/client-mirrors/envs/svc-plus-prod
          terraform -chdir=terraform-hcl-standard/client-mirrors/envs/svc-plus-prod init -backend=false -input=false -no-color
          terraform -chdir=terraform-hcl-standard/client-mirrors/envs/svc-plus-prod validate -no-color

  reconcile:
    name: Reconcile PROD Dual Mirrors & Vault KV
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
      WORKDIR: terraform-hcl-standard/client-mirrors/envs/svc-plus-prod
      MANIFEST_PATH: gitops/resources/svc.plus/prod/client-mirrors/mirrors.yaml
      SCRIPTS_DIR: terraform-hcl-standard/client-mirrors/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref }}
          path: gitops
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r terraform-hcl-standard/client-mirrors/requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Ensure Vault CLI is available
        run: |
          if ! command -v vault >/dev/null 2>&1; then
            wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq vault >/dev/null
          fi
          vault version
      - name: Load Cloudflare, Aliyun and state credentials from Vault OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-iac-client-mirrors-prod
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/prod/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | TF_VAR_cloudflare_account_id ;
            kv/data/prod/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN ;
            kv/data/prod/platform/alicloud access_key_id | ALICLOUD_ACCESS_KEY ;
            kv/data/prod/platform/alicloud access_key_secret | ALICLOUD_SECRET_KEY ;
            kv/data/CICD/prod/iac_state TF_STATE_ENDPOINT | TF_STATE_ENDPOINT ;
            kv/data/CICD/prod/iac_state TF_STATE_BUCKET | TF_STATE_BUCKET ;
            kv/data/CICD/prod/iac_state TF_STATE_ACCESS_KEY | TF_STATE_ACCESS_KEY ;
            kv/data/CICD/prod/iac_state TF_STATE_SECRET_KEY | TF_STATE_SECRET_KEY ;
            kv/data/CICD/prod/iac_state TF_STATE_REGION | TF_STATE_REGION
      - name: Render and validate Terraform workspace
        if: inputs.mode != 'verify'
        run: |
          python3 "$SCRIPTS_DIR/generate.py" render --resources "$MANIFEST_PATH" --workdir "$WORKDIR"
          python3 "$SCRIPTS_DIR/generate.py" check-hcl --root terraform-hcl-standard/client-mirrors
      - name: Ensure Aliyun CDN domain ownership TXT record in Cloudflare
        if: inputs.mode != 'verify' && inputs.run_cdn_verify_txt
        env:
          ALICLOUD_ACCESS_KEY: ${{ steps.vault.outputs.ALICLOUD_ACCESS_KEY }}
          ALICLOUD_SECRET_KEY: ${{ steps.vault.outputs.ALICLOUD_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          extra_flag=""
          if [[ "${{ inputs.mode }}" == "plan" ]]; then
            extra_flag="--dry-run"
          fi
          python3 "$SCRIPTS_DIR/ensure_aliyun_cdn_verify_txt.py" \
            --cdn-domain cn-dl.svc.plus \
            --zone-name svc.plus \
            $extra_flag
      - name: Terraform init & plan/apply
        if: inputs.mode != 'verify'
        env:
          TF_VAR_cloudflare_account_id: ${{ steps.vault.outputs.TF_VAR_cloudflare_account_id }}
          CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
          ALICLOUD_ACCESS_KEY: ${{ steps.vault.outputs.ALICLOUD_ACCESS_KEY }}
          ALICLOUD_SECRET_KEY: ${{ steps.vault.outputs.ALICLOUD_SECRET_KEY }}
          TF_STATE_ENDPOINT: ${{ steps.vault.outputs.TF_STATE_ENDPOINT }}
          TF_STATE_BUCKET: ${{ steps.vault.outputs.TF_STATE_BUCKET }}
          TF_STATE_ACCESS_KEY: ${{ steps.vault.outputs.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ steps.vault.outputs.TF_STATE_SECRET_KEY }}
          TF_STATE_REGION: ${{ steps.vault.outputs.TF_STATE_REGION }}
        run: |
          bash "$SCRIPTS_DIR/tf-init.sh" --workdir "$WORKDIR" --resources "$MANIFEST_PATH"
          terraform -chdir="$WORKDIR" validate -no-color
          if [[ "${{ inputs.mode }}" == "plan" ]]; then
            terraform -chdir="$WORKDIR" plan -input=false -no-color
          else
            terraform -chdir="$WORKDIR" apply -input=false -auto-approve -no-color
          fi
      - name: Sync minted mirror credentials into Vault KV
        if: inputs.mode == 'apply'
        run: |
          python3 "$SCRIPTS_DIR/generate.py" vault-sync --workdir "$WORKDIR"
      - name: Smoke-test R2 and OSS+CDN mirrors end-to-end
        if: inputs.mode == 'apply' || inputs.mode == 'verify'
        run: |
          bash "$SCRIPTS_DIR/verify_dual_mirrors.sh" \
            --r2-domain dl.svc.plus \
            --cn-domain cn-dl.svc.plus \
            --upload-from-vault
