name: Guance UAT IaC

# Offline checks always run. plan/apply need a real UAT Guance workspace, Vault policies/roles
# (terraform-hcl-standard/guance-cloud/vault/uat) and the `uat` / `uat-guance-apply` environments.
# Credentials only travel Vault -> step environment; nothing is written to files, artifacts or logs.
on:
  pull_request:
    paths:
      - terraform-hcl-standard/guance-cloud/**
      - .github/workflows/guance-uat.yml
  workflow_dispatch:
    inputs:
      mode:
        description: offline | plan | apply | fallback-only
        type: choice
        options: [offline, plan, apply, fallback-only]
        default: offline
      gitops_ref:
        description: GitOps ref holding resources/xworktech.com/uat/guance/observability.yaml
        type: string
        default: main
      guance_enabled:
        description: Set false to verify the Grafana fallback with every Guance step skipped
        type: boolean
        default: true
  workflow_call:
    inputs:
      mode:
        description: offline | plan | apply | fallback-only
        type: string
        default: offline
      gitops_ref:
        description: GitOps ref holding resources/xworktech.com/uat/guance/observability.yaml
        type: string
        default: main
      guance_enabled:
        description: Set false to verify the Grafana fallback with every Guance step skipped
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: guance-uat
  cancel-in-progress: false

env:
  MANIFEST: gitops/resources/xworktech.com/uat/guance/observability.yaml
  WORKDIR: iac_modules/terraform-hcl-standard/guance-cloud/envs/uat
  SCRIPTS: iac_modules/terraform-hcl-standard/guance-cloud/scripts

jobs:
  offline:
    if: ${{ inputs.mode != 'fallback-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: iac_modules
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r iac_modules/terraform-hcl-standard/guance-cloud/requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: bash "$SCRIPTS/offline-check.sh"

  plan:
    needs: offline
    if: ${{ inputs.guance_enabled && (inputs.mode == 'plan' || inputs.mode == 'apply') }}
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: iac_modules
          persist-credentials: false
      - name: Validate inputs before any credential is requested
        env:
          GITOPS_REF: ${{ inputs.gitops_ref }}
        run: |
          set -euo pipefail
          [[ "$GITOPS_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref }}
          path: gitops
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r iac_modules/terraform-hcl-standard/guance-cloud/requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Load UAT management credential and state backend from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-iac-modules-uat-guance-plan
          jwtGithubAudience: vault
          exportToken: false
          exportEnv: false
          secrets: |
            kv/data/uat/platform/observability/guance/xworktech-uat/management api_key | GUANCE_ACCESS_TOKEN ;
            kv/data/uat/platform/observability/guance/xworktech-uat/notify/uat_test_receiver opt_set | NOTIFY_UAT_TEST_RECEIVER ;
            kv/data/CICD/uat/iac_state TF_STATE_ENDPOINT | TF_STATE_ENDPOINT ;
            kv/data/CICD/uat/iac_state TF_STATE_BUCKET | TF_STATE_BUCKET ;
            kv/data/CICD/uat/iac_state TF_STATE_ACCESS_KEY | TF_STATE_ACCESS_KEY ;
            kv/data/CICD/uat/iac_state TF_STATE_SECRET_KEY | TF_STATE_SECRET_KEY ;
            kv/data/CICD/uat/iac_state TF_STATE_REGION | TF_STATE_REGION
      - name: Controlled plan (no delete/replace; plan file never leaves the runner)
        env:
          GUANCE_ACCESS_TOKEN: ${{ steps.vault.outputs.GUANCE_ACCESS_TOKEN }}
          TF_VAR_guance_notify_uat_test_receiver_opt_set: ${{ steps.vault.outputs.NOTIFY_UAT_TEST_RECEIVER }}
          TF_STATE_ENDPOINT: ${{ steps.vault.outputs.TF_STATE_ENDPOINT }}
          TF_STATE_BUCKET: ${{ steps.vault.outputs.TF_STATE_BUCKET }}
          TF_STATE_ACCESS_KEY: ${{ steps.vault.outputs.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ steps.vault.outputs.TF_STATE_SECRET_KEY }}
          TF_STATE_REGION: ${{ steps.vault.outputs.TF_STATE_REGION }}
        run: bash "$SCRIPTS/uat-terraform.sh" plan --resources "$MANIFEST" --workdir "$WORKDIR"

  apply:
    needs: plan
    if: ${{ inputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    environment: uat-guance-apply # protected: required reviewers approve the apply
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: iac_modules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref }}
          path: gitops
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r iac_modules/terraform-hcl-standard/guance-cloud/requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Load UAT management credential and state backend from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-iac-modules-uat-guance-apply
          jwtGithubAudience: vault
          exportToken: false
          exportEnv: false
          secrets: |
            kv/data/uat/platform/observability/guance/xworktech-uat/management api_key | GUANCE_ACCESS_TOKEN ;
            kv/data/uat/platform/observability/guance/xworktech-uat/notify/uat_test_receiver opt_set | NOTIFY_UAT_TEST_RECEIVER ;
            kv/data/CICD/uat/iac_state TF_STATE_ENDPOINT | TF_STATE_ENDPOINT ;
            kv/data/CICD/uat/iac_state TF_STATE_BUCKET | TF_STATE_BUCKET ;
            kv/data/CICD/uat/iac_state TF_STATE_ACCESS_KEY | TF_STATE_ACCESS_KEY ;
            kv/data/CICD/uat/iac_state TF_STATE_SECRET_KEY | TF_STATE_SECRET_KEY ;
            kv/data/CICD/uat/iac_state TF_STATE_REGION | TF_STATE_REGION
      - name: Plan, guard and apply the same saved plan
        env:
          GUANCE_ACCESS_TOKEN: ${{ steps.vault.outputs.GUANCE_ACCESS_TOKEN }}
          TF_VAR_guance_notify_uat_test_receiver_opt_set: ${{ steps.vault.outputs.NOTIFY_UAT_TEST_RECEIVER }}
          TF_STATE_ENDPOINT: ${{ steps.vault.outputs.TF_STATE_ENDPOINT }}
          TF_STATE_BUCKET: ${{ steps.vault.outputs.TF_STATE_BUCKET }}
          TF_STATE_ACCESS_KEY: ${{ steps.vault.outputs.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ steps.vault.outputs.TF_STATE_SECRET_KEY }}
          TF_STATE_REGION: ${{ steps.vault.outputs.TF_STATE_REGION }}
        run: bash "$SCRIPTS/uat-terraform.sh" apply --resources "$MANIFEST" --workdir "$WORKDIR"
      - name: Post-release check, second plan must be empty
        env:
          GUANCE_ACCESS_TOKEN: ${{ steps.vault.outputs.GUANCE_ACCESS_TOKEN }}
          TF_VAR_guance_notify_uat_test_receiver_opt_set: ${{ steps.vault.outputs.NOTIFY_UAT_TEST_RECEIVER }}
          TF_STATE_ENDPOINT: ${{ steps.vault.outputs.TF_STATE_ENDPOINT }}
          TF_STATE_BUCKET: ${{ steps.vault.outputs.TF_STATE_BUCKET }}
          TF_STATE_ACCESS_KEY: ${{ steps.vault.outputs.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ steps.vault.outputs.TF_STATE_SECRET_KEY }}
          TF_STATE_REGION: ${{ steps.vault.outputs.TF_STATE_REGION }}
        run: bash "$SCRIPTS/uat-terraform.sh" plan --expect-no-changes --resources "$MANIFEST" --workdir "$WORKDIR"
      - name: Upload CMDB (resource identities only)
        uses: actions/upload-artifact@v4
        with:
          name: guance-uat-cmdb
          path: ${{ env.WORKDIR }}/cmdb.json
          if-no-files-found: error
          retention-days: 7

  grafana-fallback:
    # Independent of every Guance job: no Vault, no Guance variable. With guance_enabled=false this
    # is the only job that runs, proving the baseline monitoring path stands alone.
    if: ${{ !cancelled() && (inputs.mode == 'plan' || inputs.mode == 'apply' || inputs.mode == 'fallback-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: iac_modules
          persist-credentials: false
      - run: bash "$SCRIPTS/grafana-fallback-check.sh"
